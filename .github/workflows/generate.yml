name: Viral Content Factory

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "ضع رابط المقال الأصلي"
        required: true
        type: string
      force_reprocess:
        description: "إعادة معالجة الرابط حتى لو عولج سابقًا"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: viral-content-factory
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Arabic Content and Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Groq API key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "::error::Missing GROQ_API_KEY in GitHub Secrets."
            exit 1
          fi

      - name: Generate content
        id: generate
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
          FORCE_REPROCESS: ${{ inputs.force_reprocess }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VISION_PROVIDER: ${{ vars.VISION_PROVIDER }}
          MAX_ARTICLE_CHARS: "30000"
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Verify output
        shell: bash
        env:
          OUT_DIR: ${{ steps.generate.outputs.out_dir }}
        run: |
          set -euo pipefail

          if [[ -z "${OUT_DIR:-}" || ! -d "$OUT_DIR" ]]; then
            echo "::error::Output directory for this article was not created."
            exit 1
          fi

          if [[ -z "$(find "$OUT_DIR" -type f -print -quit)" ]]; then
            echo "::error::No output files were generated."
            exit 1
          fi

      - name: Upload output (this article only)
        uses: actions/upload-artifact@v4
        with:
          name: viral-content-package
          path: ${{ steps.generate.outputs.out_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "Generate article content"

          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"
