
name: Viral Content Factory

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "ضع رابط المقال الأصلي"
        required: true
        type: string

      force_reprocess:
        description: "إعادة معالجة الرابط حتى لو عولج سابقًا"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: viral-content-factory
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Arabic Article and Facebook Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Groq configuration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "::error::Missing GROQ_API_KEY GitHub secret."
            exit 1
          fi

          if [[ -n "${GROQ_MODEL:-}" ]]; then
            echo "A custom Groq model has been configured."
          else
            echo "Using the default model configured in grok.py."
          fi

      - name: Validate article URL
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw_url = os.environ.get("ARTICLE_URL", "").strip()

          try:
              parsed = urlsplit(raw_url)
              valid = (
                  parsed.scheme.lower() in ("http", "https")
                  and bool(parsed.hostname)
                  and not parsed.username
                  and not parsed.password
                  and parsed.port in (None, 80, 443)
              )
          except ValueError:
              valid = False

          if not valid:
              raise SystemExit(
                  "::error::Provide a valid public HTTP(S) article URL."
              )
          PY

      - name: Generate article and image
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
          FORCE_REPROCESS: ${{ inputs.force_reprocess }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          MAX_ARTICLE_CHARS: "30000"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          python main.py

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d output ]]; then
            echo "::error::The output directory was not created."
            exit 1
          fi

          RESULT_FILE="$(find output -type f -name result.json -print -quit)"

          if [[ -z "$RESULT_FILE" ]]; then
            echo "::error::No result.json was generated."
            exit 1
          fi

          RESULT_DIR="$(dirname "$RESULT_FILE")"

          for FILE in \
            "facebook_post.txt" \
            "rewritten_article.md" \
            "result.json"
          do
            if [[ ! -s "$RESULT_DIR/$FILE" ]]; then
              echo "::error::Missing or empty output: $FILE"
              exit 1
            fi
          done

          python - "$RESULT_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          result_path = Path(sys.argv[1])

          try:
              data = json.loads(result_path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              raise SystemExit(f"::error::Invalid result.json: {exc}")

          required = (
              "source_url",
              "title",
              "rewritten_article",
              "facebook_post",
              "hashtags",
          )

          for key in required:
              if key not in data:
                  raise SystemExit(
                      f"::error::Missing field in result.json: {key}"
                  )

          image_name = data.get("image_file")

          if image_name:
              image_path = result_path.parent / image_name

              if not image_path.is_file() or image_path.stat().st_size == 0:
                  raise SystemExit(
                      "::error::The image listed in result.json is missing."
                  )
          else:
              print(
                  "::warning::No article image was generated. "
                  "Text outputs are available."
              )

          print("Output validation completed.")
          PY

      - name: Upload content package
        uses: actions/upload-artifact@v4
        with:
          name: content-package
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::Run this workflow from a branch, not a tag."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "Generate article content"

          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

          git push origin "HEAD:refs/heads/$BRANCH"
