name: Story Factory

on:
  schedule:
    # قصة واحدة يوميًا بتوقيت المغرب (Africa/Casablanca): من 13:25 حتى 17:59.
    # توقيت المغرب UTC+1 عادةً وUTC+0 في رمضان. GitHub يؤخر المجدولات أحيانًا أو
    # يُسقطها، فنضع عدة محاولات، وتقرر وظيفة schedule-gate: هل نحن داخل النافذة ولم
    # تُنشر قصة اليوم بعد؟ أول محاولة ناجحة تعمل وما بعدها يُتخطى (لا ضياع ولا تكرار).
    - cron: "25 12 * * *"    # 13:25 بتوقيت المغرب في الوضع العادي (UTC+1)
    - cron: "55 12 * * *"    # محاولة احتياطية 13:55
    - cron: "25 13 * * *"    # 13:25 في رمضان (UTC+0) / 14:25 في الوضع العادي
    - cron: "25 14 * * *"    # محاولة احتياطية
    - cron: "25 15 * * *"    # محاولة احتياطية أخيرة
  workflow_dispatch:
    inputs:
      story_category:
        description: "تصنيف القصة (auto = الدوران التلقائي بين الأربعة)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - قصص الجرائم والتحقيقات البوليسية
          - قصص الرعب والماورائيات والغموض
          - القصص الاجتماعية الواقعية والدراما
          - قصص الذكاء والمكر والخدع
      publish_to_blogger:
        description: "النشر على Blogger عبر Make (ألغِه في تشغيلات الاختبار)"
        required: false
        default: true
        type: boolean
      send_whatsapp:
        description: "إرسال صورة المنشور ونصه والتعليق الأول إلى واتساب (GREEN-API)"
        required: false
        default: true
        type: boolean
      slot:
        description: "للاستدعاء الخارجي فقط (cron-job.org): story. اتركه فارغًا في التشغيل اليدوي"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: story-factory
  cancel-in-progress: false

jobs:
  schedule-gate:
    name: Check Morocco time slot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.slot.outputs.run }}
      slot: ${{ steps.slot.outputs.slot }}
      day: ${{ steps.slot.outputs.day }}
      unattended: ${{ steps.slot.outputs.unattended }}
    steps:
      - name: Checkout repository (to read slot markers)
        if: ${{ github.event_name == 'schedule' || inputs.slot != '' }}
        uses: actions/checkout@v4
        with:
          # آخر حالة للفرع (لا commit لحظة الجدولة) كي نرى علامات المواعيد المنجزة
          ref: ${{ github.ref_name }}

      - name: Decide whether to run now
        id: slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          NOW="${GATE_NOW:-now}"      # GATE_NOW للاختبار فقط
          DAY="$(TZ=Africa/Casablanca date -d "$NOW" +%F)"
          SLOT=""

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            # نافذة القصة بتوقيت المغرب (بالدقائق من منتصف الليل):
            #   story: 13:25 (805) إلى 17:59 (1079)
            HOUR="$(TZ=Africa/Casablanca date -d "$NOW" +%H)"
            MINUTE="$(TZ=Africa/Casablanca date -d "$NOW" +%M)"
            MINUTES_OF_DAY=$(( 10#$HOUR * 60 + 10#$MINUTE ))
            if (( MINUTES_OF_DAY >= 805 && MINUTES_OF_DAY <= 1079 )); then
              SLOT=story
            fi
            echo "Morocco time: $DAY ${HOUR}:${MINUTE} slot=${SLOT:-none}"
            if [[ -z "$SLOT" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Outside the story window (13:25-17:59 Morocco time); skipping."
              exit 0
            fi
          elif [[ -n "$INPUT_SLOT" ]]; then
            # استدعاء خارجي (cron-job.org) يحدد الموعد صراحةً
            case "$INPUT_SLOT" in
              story|story1) SLOT="story" ;;
              *) echo "::error::slot must be 'story' (got '$INPUT_SLOT')"; exit 1 ;;
            esac
            echo "External trigger for the $SLOT slot of $DAY"
          else
            # تشغيل يدوي عادي: يمر دائمًا ولا يستهلك موعدًا
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "unattended=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -f "output/_slots/${DAY}-${SLOT}.txt" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The $SLOT story of $DAY was already published; skipping."
            exit 0
          fi
          {
            echo "run=true"
            echo "slot=$SLOT"
            echo "day=$DAY"
            echo "unattended=true"
          } >> "$GITHUB_OUTPUT"

  generate:
    name: Generate Story and Publish
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numpy arabic-reshaper python-bidi

      - name: Install ffmpeg (story video)
        if: ${{ vars.STORY_VIDEO != 'off' }}
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Ensure Arabic font
        shell: bash
        run: |
          mkdir -p fonts
          if [[ ! -f fonts/IBMPlexSansArabic-Bold.ttf ]]; then
            curl -fsSL -o fonts/IBMPlexSansArabic-Bold.ttf \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf" \
              || echo "::warning::Could not download the Arabic font."
          fi

      - name: Preflight check (files, imports, secrets)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_WRITER_API_KEY: ${{ secrets.GEMINI_WRITER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_SECRET: ${{ secrets.MAKE_WEBHOOK_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || vars.BLOGGER_BLOG_ID }}
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_CHAT_ID: ${{ secrets.GREENAPI_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python preflight.py

      - name: Generate story
        id: generate
        env:
          STORY_CATEGORY: ${{ inputs.story_category != 'auto' && inputs.story_category || '' }}
          STORY_MIN_WORDS: ${{ vars.STORY_MIN_WORDS }}
          STORY_SAFETY_THRESHOLD: ${{ vars.STORY_SAFETY_THRESHOLD }}
          GEMINI_WRITER_API_KEY: ${{ secrets.GEMINI_WRITER_API_KEY }}
          GEMINI_WRITER_MODEL: ${{ vars.GEMINI_WRITER_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_IMAGE_MODEL: ${{ vars.CF_IMAGE_MODEL }}
          CF_IMAGE_FALLBACK_MODEL: ${{ vars.CF_IMAGE_FALLBACK_MODEL }}
          CF_IMAGE_ENABLED: ${{ vars.CF_IMAGE_ENABLED }}
          FB_IMAGE_RATIO: ${{ vars.FB_IMAGE_RATIO }}
          ADD_IMAGE_TEXT: ${{ vars.ADD_IMAGE_TEXT }}
          PYTHONUNBUFFERED: "1"
        run: python story_factory.py

      - name: Verify output
        shell: bash
        env:
          OUT_DIR: ${{ steps.generate.outputs.out_dir }}
        run: |
          set -euo pipefail

          if [[ -z "${OUT_DIR:-}" || ! -d "$OUT_DIR" ]]; then
            echo "::error::Output directory for this story was not created."
            exit 1
          fi

          for f in result.json rewritten_article.md facebook_post.txt first_comment.txt facebook_image.jpg; do
            if [[ ! -s "$OUT_DIR/$f" ]]; then
              echo "::error::Missing or empty $f in $OUT_DIR"
              exit 1
            fi
          done

      - name: Build story video (narration + YouTube via Make)
        if: ${{ vars.STORY_VIDEO != 'off' }}
        continue-on-error: true
        shell: bash
        env:
          OUT_DIR: ${{ steps.generate.outputs.out_dir }}
          WORK_DIR: ${{ steps.generate.outputs.work_dir }}
          STORY_VIDEO: ${{ vars.STORY_VIDEO }}
          GH_TOKEN: ${{ github.token }}
          MAKE_VIDEO_WEBHOOK_URL: ${{ secrets.MAKE_VIDEO_WEBHOOK_URL }}
          MAKE_VIDEO_WEBHOOK_SECRET: ${{ secrets.MAKE_VIDEO_WEBHOOK_SECRET }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID || vars.YOUTUBE_CHANNEL_ID }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_WRITER_API_KEY: ${{ secrets.GEMINI_WRITER_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          STORY_TTS_STYLE: ${{ vars.STORY_TTS_STYLE }}
          STORY_TTS_OUTRO: ${{ vars.STORY_TTS_OUTRO }}
          STORY_TTS_CHUNK_WORDS: ${{ vars.STORY_TTS_CHUNK_WORDS }}
          STORY_VIDEO_WAIT_MINUTES: ${{ vars.STORY_VIDEO_WAIT_MINUTES }}
          STORY_BLOG_URL: ${{ vars.STORY_BLOG_URL }}
          STORY_SAFETY_THRESHOLD: ${{ vars.STORY_SAFETY_THRESHOLD }}
          PYTHONUNBUFFERED: "1"
        run: python story_video.py

      - name: Upload video files (for listening checks)
        if: ${{ vars.STORY_VIDEO != 'off' }}
        uses: actions/upload-artifact@v4
        with:
          name: story-video
          path: ${{ steps.generate.outputs.work_dir }}/video_out
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload output (this story only)
        uses: actions/upload-artifact@v4
        with:
          name: story-package
          path: ${{ steps.generate.outputs.out_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Mark publishing slot as done
        if: ${{ needs.schedule-gate.outputs.slot != '' }}
        shell: bash
        env:
          SLOT: ${{ needs.schedule-gate.outputs.slot }}
          DAY: ${{ needs.schedule-gate.outputs.day }}
        run: |
          mkdir -p output/_slots
          echo "done $(date -u +%FT%TZ)" > "output/_slots/${DAY}-${SLOT}.txt"

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "Generate story content"

          # قد يدفع workflow الأخبار في اللحظة نفسها: نعيد المحاولة بعد rebase
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push after 4 attempts."
          exit 1

      - name: Publish via Make
        if: ${{ needs.schedule-gate.outputs.unattended == 'true' || inputs.publish_to_blogger }}
        continue-on-error: true
        shell: bash
        env:
          OUT_DIR: ${{ steps.generate.outputs.out_dir }}
          BLOGGER_DRAFT: ${{ vars.BLOGGER_DRAFT }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_SECRET: ${{ secrets.MAKE_WEBHOOK_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || vars.BLOGGER_BLOG_ID }}
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # الصور دُفعت في الخطوة السابقة؛ نستخدم commit الحالي في روابط CDN
          export BLOGGER_COMMIT_SHA="$(git rev-parse HEAD)"
          python make_publish.py

      - name: Commit publish result
        if: ${{ needs.schedule-gate.outputs.unattended == 'true' || inputs.publish_to_blogger }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- output/

          if git diff --cached --quiet; then
            echo "No publish result changes to commit."
            exit 0
          fi

          git commit -m "Save story publish result"

          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push after 4 attempts."
          exit 1

      - name: Send package to WhatsApp (GREEN-API)
        if: ${{ needs.schedule-gate.outputs.unattended == 'true' || inputs.send_whatsapp }}
        continue-on-error: true
        shell: bash
        env:
          OUT_DIR: ${{ steps.generate.outputs.out_dir }}
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_CHAT_ID: ${{ secrets.GREENAPI_CHAT_ID }}
          GREENAPI_API_URL: ${{ vars.GREENAPI_API_URL }}
          GREENAPI_MEDIA_URL: ${{ vars.GREENAPI_MEDIA_URL }}
          PYTHONUNBUFFERED: "1"
        run: python whatsapp_notify.py
